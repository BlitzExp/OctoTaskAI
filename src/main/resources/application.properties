spring.application.name=octotask-ai
server.port=${SERVER_PORT:8080}

# --- Oracle ATP ---
driver_class_name=${DRIVER_CLASS_NAME:oracle.jdbc.OracleDriver}
db_user=${DB_USER:octotask}
dbpassword=${DB_PASSWORD:}
db_url=${DB_URL:jdbc:oracle:thin:@?TNS_ADMIN=./wallet}

# --- Secondary Oracle (another DB instance) ---
db2_user=${DB2_USER:}
db2_password=${DB2_PASSWORD:}
db2_url=${DB2_URL:}
db2_driver_class_name=${DB2_DRIVER_CLASS_NAME:${DRIVER_CLASS_NAME:oracle.jdbc.OracleDriver}}


# --- Telegram ---
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
# Optional shared secret echoed by Telegram in X-Telegram-Bot-Api-Secret-Token; if set, the webhook rejects mismatches
telegram.webhook.secret=${TELEGRAM_WEBHOOK_SECRET:}

# Enable DJL embedding service by default (loads ONNX model from resources)
embeddings.djl.enabled=true

# --- Local LLM (Ollama) for NLP phrasing + slot extraction ---
ollama.enabled=${OLLAMA_ENABLED:true}
ollama.url=${OLLAMA_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:qwen2.5:1.5b-instruct}
ollama.timeout-ms=${OLLAMA_TIMEOUT_MS:30000}

# --- Bot login ---
# Legacy shared access code (used only for the fallback "/login <code> <name>" path)
bot.login.access-code=${BOT_ACCESS_CODE:}
# Issue one private per-user login code on startup (preferred "/login <code>" path).
# Idempotent: only users without a code get one.
bot.login.codes.seed=${BOT_LOGIN_CODES_SEED:false}
# Minimum cosine similarity (1 - distance) for a semantic route to be accepted
bot.router.min-similarity=${BOT_ROUTER_MIN_SIMILARITY:0.45}
# Seed rutas_semanticas with example phrasings on startup (only if the table is empty)
bot.router.seed-on-startup=${BOT_ROUTER_SEED:false}
# Intent-level clarification: if the best route beats the next-best (different)
# tool by less than this margin, ask the user which they meant.
bot.router.ambiguity-margin=${BOT_ROUTER_AMBIGUITY_MARGIN:0.06}
# Below this absolute similarity the guess is weak → confirm before acting.
bot.router.confirm-below=${BOT_ROUTER_CONFIRM_BELOW:0.58}
# When true, wipe all existing routes before seeding (clears stale/polluted rows, then reseeds clean)
bot.router.reset=${BOT_ROUTER_RESET:false}

# --- Bot tuning ---
bot.memory.max-chars=${BOT_MEMORY_MAX_CHARS:200}
# Reply phrasing: above this serialized-JSON size, skip the local LLM and use the
# fast deterministic formatter (avoids 30s Ollama timeouts on large result sets).
bot.reply.llm-max-chars=${BOT_REPLY_LLM_MAX_CHARS:1000}
# How many list items to show before collapsing the rest into "…y N más".
bot.reply.list-page-size=${BOT_REPLY_LIST_PAGE_SIZE:10}
