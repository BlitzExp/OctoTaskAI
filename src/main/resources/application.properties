spring.application.name=octotask-ai
server.port=${SERVER_PORT:8080}

# --- Oracle ATP ---
driver_class_name=${DRIVER_CLASS_NAME:oracle.jdbc.OracleDriver}
db_user=${DB_USER:octotask}
dbpassword=${DB_PASSWORD:}
db_url=${DB_URL:jdbc:oracle:thin:@?TNS_ADMIN=./wallet}

# --- Secondary Oracle (another DB instance) ---
db2_user=${DB2_USER:}
db2_password=${DB2_PASSWORD:}
db2_url=${DB2_URL:}
db2_driver_class_name=${DB2_DRIVER_CLASS_NAME:${DRIVER_CLASS_NAME:oracle.jdbc.OracleDriver}}


# --- Telegram ---
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
# Optional shared secret echoed by Telegram in X-Telegram-Bot-Api-Secret-Token; if set, the webhook rejects mismatches
telegram.webhook.secret=${TELEGRAM_WEBHOOK_SECRET:}

# Enable DJL embedding service by default (loads ONNX model from resources)
embeddings.djl.enabled=true

# --- Local LLM (Ollama) for NLP phrasing + slot extraction ---
ollama.enabled=${OLLAMA_ENABLED:true}
ollama.url=${OLLAMA_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:qwen2.5:3b}
ollama.timeout-ms=${OLLAMA_TIMEOUT_MS:30000}

# --- Bot login ---
# Shared access code required to link a Telegram chat to an APP_USER
bot.login.access-code=${BOT_ACCESS_CODE:}
# Minimum cosine similarity (1 - distance) for a semantic route to be accepted
bot.router.min-similarity=${BOT_ROUTER_MIN_SIMILARITY:0.45}
# Seed rutas_semanticas with example phrasings on startup (only if the table is empty)
bot.router.seed-on-startup=${BOT_ROUTER_SEED:false}

# --- Bot tuning ---
bot.memory.max-chars=${BOT_MEMORY_MAX_CHARS:200}
